<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>올공 - 공고 페이지로 이동 중...</title>
  <style>body{font-family:'Malgun Gothic',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;color:#495057}</style>
</head>
<body>
  <p>공고 페이지로 이동 중입니다...</p>
  <script>
    // SNS 게시물용 짧은 링크: ?c=짧은코드 또는 ?j=문서ID → 올공 사이트의 해당 공고 상세로 리다이렉트
    // (기관 원문 링크는 상세 화면의 '지원하기' 버튼으로 제공 — 방문자가 올공을 거쳐 가도록)
    (function () {
      var FS = 'https://firestore.googleapis.com/v1/projects/recruit-board/databases/(default)/documents';
      var p = new URLSearchParams(location.search);
      var HOME = 'https://www.allgongin.com';
      function fail() { location.replace(HOME); }
      function goDetail(id) {
        if (id) location.replace(HOME + '/#job-detail-' + encodeURIComponent(id));
        else fail();
      }
      var j = p.get('j'), c = p.get('c');
      if (j) {
        // 문서 ID를 이미 알고 있으므로 조회 없이 바로 상세로 이동
        // (마감·삭제된 공고는 사이트가 목록으로 처리)
        goDetail(j);
      } else if (c) {
        fetch(FS + ':runQuery', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ structuredQuery: { from: [{ collectionId: 'jobs' }], where: { fieldFilter: { field: { fieldPath: 'sc' }, op: 'EQUAL', value: { stringValue: c } } }, limit: 1 } })
        })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (rows) {
            var name = rows && rows[0] && rows[0].document && rows[0].document.name;
            goDetail(name ? name.split('/').pop() : null);
          })
          .catch(fail);
      } else { fail(); }
    })();
  </script>
</body>
</html>
