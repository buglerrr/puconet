<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>올공 - 유튜브 인증 코드</title>
  <style>
    body{font-family:'Malgun Gothic','맑은 고딕',Apple SD Gothic Neo,sans-serif;background:#f8f9fa;
         display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;box-sizing:border-box;color:#212529}
    .box{background:#fff;border:1px solid #e9ecef;border-radius:14px;padding:36px 32px;max-width:640px;width:100%;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.06)}
    h1{font-size:1.3rem;margin:0 0 14px}
    p{color:#495057;line-height:1.7;margin:0 0 18px}
    .code{font-family:monospace;font-size:.95rem;word-break:break-all;background:#f1f3f5;border:1px dashed #adb5bd;
          border-radius:8px;padding:16px;margin-bottom:16px;user-select:all}
    button{background:#1c7ed6;color:#fff;border:none;border-radius:8px;padding:12px 26px;font-size:1rem;font-weight:700;cursor:pointer}
    button:hover{background:#1971c2}
    .err{color:#e03131;font-weight:700}
  </style>
</head>
<body>
  <div class="box">
    <h1>🎬 올공 유튜브 인증</h1>
    <div id="content"></div>
  </div>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var el = document.getElementById('content');
      var code = q.get('code');
      var err = q.get('error');
      if (code) {
        el.innerHTML =
          '<p>✅ 인증이 완료되었습니다!<br>아래 <b>인증 코드</b>를 복사해서 Cloud Shell 창에 붙여넣어 주세요.</p>' +
          '<div class="code" id="codeBox"></div>' +
          '<button onclick="navigator.clipboard.writeText(document.getElementById(\'codeBox\').textContent).then(function(){alert(\'복사되었습니다! Cloud Shell 에 붙여넣어 주세요.\')})">📋 코드 복사하기</button>';
        document.getElementById('codeBox').textContent = code;
      } else if (err) {
        el.innerHTML = '<p class="err">인증이 거부되었습니다 (' + err.replace(/[<>]/g, '') + ').<br>Cloud Shell 에서 스크립트를 다시 실행해 주세요.</p>';
      } else {
        el.innerHTML = '<p>이 페이지는 유튜브 자동 업로드 인증 과정에서 사용됩니다.<br>Cloud Shell 에서 <b>python3 youtube_auth2.py</b> 실행 후 안내를 따라 주세요.</p>';
      }
    })();
  </script>
</body>
</html>
